[project]
name = "icrush-influencer-mvp"
version = "0.7.2"
description = "ICRUSH German/Austrian influencer sourcing MVP - automated judgment pipeline"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "langdetect>=1.0",
    "playwright>=1.60",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.24"]

[project.scripts]
icrush-batch = "scripts.run_batch:main_cli"
icrush-refresh = "scripts.refresh_wednesday_cache:main_cli"
